; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_protocol = esptool

[env:transmitter_v2]
platform = espressif32
board = heltec_wifi_lora_32_V2
build_flags = 
	-D LoRaWAN_DEBUG_LEVEL=3
	-D LORAWAN_PREAMBLE_LENGTH=8
	-DMCU_ESP32_D0
	-D ARDUINO_HELTEC_WIFI_LORA_32_V2
	-D WIFI_LORA_32_V2
	-D HELTEC_WIFI_LORA_32_V2
	-D REGION_AU915
	-D LORA_DISPLAY
	-DHELTEC_BOARD
	-DRADIO_CHIP_SX1276
	-DSLOW_CLK_TPYE=0
lib_deps = 
	mikalhart/TinyGPSPlus@^1.1.0
	plerup/EspSoftwareSerial@^8.2.0
	tockn/MPU6050_tockn@^1.5.2
	adafruit/Adafruit GFX Library@^1.12.0
	jgromes/RadioLib@^7.1.2
	jgromes/RadioBoards@^1.0.0
	heltecautomation/Heltec ESP32 Dev-Boards@^2.1.4
	knolleary/PubSubClient@^2.8
build_src_filter = +<transmitter/transmitter.cpp> -<receiver/*>

[env:transmitter_v3]
board = heltec_wifi_lora_32_V3
platform = espressif32@6.3.2
board_build.mcu = esp32s3
build_flags = 
	-D LoRaWAN_DEBUG_LEVEL=3
	-D LORAWAN_PREAMBLE_LENGTH=8
	-DMCU_ESP32S3_D0
	-D ARDUINO_HELTEC_WIFI_LORA_32_V3
	-D WIFI_LORA_32_V3
	-D HELTEC_WIFI_LORA_32_V2
	-D REGION_AU915
	-D LORA_DISPLAY
	-DHELTEC_BOARD
	-D RADIO_CHIP_SX1262
	-D SLOW_CLK_TPYE=0
lib_deps = 
	mikalhart/TinyGPSPlus@^1.1.0
	plerup/EspSoftwareSerial@^8.2.0
	tockn/MPU6050_tockn@^1.5.2
	adafruit/Adafruit GFX Library@^1.12.0
	jgromes/RadioLib@^7.1.2
	jgromes/RadioBoards@^1.0.0
	heltecautomation/Heltec ESP32 Dev-Boards@^2.1.4
	knolleary/PubSubClient@^2.8
build_src_filter = +<transmitter/transmitter.cpp> -<receiver/*>

[env:receiver]
platform = espressif32@6.3.2
board = heltec_wifi_lora_32_V3
framework = arduino
board_build.mcu = esp32s3
board_build.arduino.variant = esp32s3
build_flags = 
	${env.build_flags}
	-D ARDUINO_LoRaWAN_REGION_AU915
	-D USE_BAND_915
	-D ARDUINO_HELTEC_WIFI_LORA_32_V3
	-D WIFI_LORA_32_V3
	-D HELTEC_WIFI_LORA_32_V3
	-D CFG_au915=1
	-D LoRaWAN_DEBUG_LEVEL=3
	-D SLOW_CLK_TPYE
	-D HELTEC_BOARD
	-D RADIO_CHIP_SX126X
lib_deps = 
	adafruit/Adafruit GFX Library@^1.12.0
	jgromes/RadioLib@^7.1.2
	jgromes/RadioBoards@^1.0.0
	heltecautomation/Heltec ESP32 Dev-Boards@^2.1.4
	knolleary/PubSubClient@^2.8
build_src_filter = -<transmitter/transmitter.cpp> +<receiver/*>
